name: Build ILSpy

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master, release/** ]

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: '11.0.x' # .NET SDK 版本
  DOTNET_SDK_QUALITY: 'preview' # SDK 质量级别
  StagingDirectory: buildartifacts # 构建产物暂存目录
  Configuration: Release # 仅保留正式发布版 (Release) 配置，移除 Debug

jobs:
  # 门禁 Job：用于跳过那些已经有打开的 PR 正在构建的分支的 push 构建，避免重复浪费资源
  Gate:
    permissions:
      pull-requests: read
    uses: ./.github/workflows/pr-build-gate.yml

  # Windows 桌面版主构建 Job：负责编译、打包 Windows 平台的各类产物 (ZIP, MSI, VSIX)
  Build:
    name: Desktop (Windows)
    needs: Gate # 依赖 Gate job 的结果
    if: needs.Gate.outputs.run == 'true' # 仅当 Gate 允许运行时执行
    runs-on: windows-2025-vs2026
    env:
      BuildPlatform: Any CPU
      BuildAndPublishVsix: true # 是否构建 Visual Studio 扩展

    defaults:
      run:
        shell: pwsh # 默认使用 PowerShell Core

    steps:
    - name: 创建暂存目录
      run: mkdir -p $env:StagingDirectory

    - name: 签出代码
      uses: actions/checkout@v7.0.1
      with:
        submodules: true # 包含子模块
        fetch-depth: 0 # 获取完整提交历史
        persist-credentials: false

    - name: 配置 .NET SDK
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}
        cache: true # 启用依赖缓存
        cache-dependency-path: '**/packages.lock.json'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        DOTNET_ROOT: ${{ runner.temp }}/.dotnet

    - name: 将 msbuild 添加到 PATH
      uses: microsoft/setup-msbuild@v3.0.0

    - name: 安装 wix 工具 (锁定版本，用于制作安装包)
      run: dotnet tool install --global wix --version 6.0.2

    - name: 安装 wix UI 扩展 (锁定版本)
      run: wix.exe extension add -g WixToolset.UI.wixext/6.0.2

    - name: 获取版本号
      id: version
      run: |
        .\BuildTools\ghactions-install.ps1
        # 将 ILSPY_ 开头的环境变量输出到 GitHub Output 供后续步骤使用
        Get-ChildItem Env: | Where-Object {$_.Name -Match "^ILSPY_"} | %{ echo "$($_.Name)=$($_.Value)" } | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: 还原应用程序依赖
      run: >
        dotnet restore ILSpy.slnx
        /p:RestoreEnablePackagePruning=false
        /p:Configuration=${{ env.Configuration }}
        /p:Platform="$env:BuildPlatform"

    - name: 编译项目
      run: >
        dotnet build -mt ILSpy.slnx --no-restore
        -c ${{ env.Configuration }}
        /p:Platform="$env:BuildPlatform"

    - name: 发布 x64/arm64 框架依赖/独立部署版本
      run: .\publish.ps1 -Configuration ${{ env.Configuration }}

    - name: 打包 ILSpy (框架依赖版 x64)
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_binaries.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ env.Configuration }}\net10.0\win-x64\publish\fwdependent\*

    - name: 打包 ILSpy (独立部署版 x64)
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_selfcontained_x64.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ env.Configuration }}\net10.0\win-x64\publish\selfcontained\*

    - name: 打包 ILSpy (框架依赖版 arm64)
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_binaries_arm64.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ env.Configuration }}\net10.0\win-arm64\publish\fwdependent\*

    - name: 构建 MSI 安装包 (x64 和 arm64, 框架依赖)
      run: |
        dotnet msbuild ILSpy.Installer.slnx /t:Restore /p:Configuration="${{ env.Configuration }}" /p:Platform="Any CPU"
        dotnet msbuild ILSpy.Installer.slnx /p:Configuration="${{ env.Configuration }}" /p:Platform="Any CPU"
        dotnet msbuild ILSpy.Installer.slnx /p:Configuration="${{ env.Configuration }}" /p:Platform="Any CPU" /p:PlatformForInstaller="ARM64"

    - name: 构建 VS 扩展 (适用于 VS 2022)
      if: env.BuildAndPublishVsix == 'true'
      run: dotnet build ILSpy.VSExtensions.slnx -c ${{ env.Configuration }}

    - name: 上传 VSIX (VS 2022) 构建产物
      if: env.BuildAndPublishVsix == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy VS Addin for VS 2022 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ILSpy.AddIn.VS2022\bin\${{ env.Configuration }}\net472\*.vsix
        if-no-files-found: error

    - name: 上传压缩包构建产物 (框架依赖 x64)
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (Binaries)
        path: ${{ env.StagingDirectory }}\ILSpy_binaries.zip
        if-no-files-found: error

    - name: 上传独立部署版压缩包 (x64)
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy self-contained x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}\ILSpy_selfcontained_x64.zip
        if-no-files-found: error

    - name: 上传框架依赖版压缩包 (arm64)
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy arm64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}\ILSpy_binaries_arm64.zip
        if-no-files-found: error

    - name: 上传 MSI 安装包构建产物 (x64)
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy Installer x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ILSpy.Installer\wix\*-x64.msi
        if-no-files-found: error

    - name: 上传 MSI 安装包构建产物 (arm64)
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy Installer arm64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ILSpy.Installer\wix\*-arm64.msi
        if-no-files-found: error

  # Linux 和 macOS 桌面版构建 Job：负责编译并打包跨平台桌面产物 (AppImage, Deb, Rpm, App Bundle)
  Desktop:
    name: Desktop (${{ matrix.platform }})
    needs: Gate
    if: needs.Gate.outputs.run == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: pwsh

    steps:
    - name: 创建暂存目录
      run: mkdir -p $env:StagingDirectory

    - name: 签出代码
      uses: actions/checkout@v7.0.1
      with:
        submodules: true
        fetch-depth: 0
        persist-credentials: false

    - name: 配置 .NET SDK
      uses: actions/setup-dotnet@v6.0.0
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}
        cache: true
        cache-dependency-path: '**/packages.lock.json'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        DOTNET_ROOT: ${{ runner.temp }}/.dotnet

    - name: 获取版本号
      id: version
      run: |
        ./BuildTools/ghactions-install.ps1
        # 将 ILSPY_ 开头的环境变量输出到 GitHub Output 供后续步骤使用
        Get-ChildItem Env: | Where-Object {$_.Name -Match "^ILSPY_"} | %{ echo "$($_.Name)=$($_.Value)" } | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: 还原桌面版解决方案依赖
      run: >
        dotnet restore ILSpy.Desktop.slnf
        /p:RestoreEnablePackagePruning=false
        /p:Configuration=${{ env.Configuration }}
        /p:Platform="Any CPU"

    - name: 编译桌面版项目
      run: >
        dotnet build ILSpy.Desktop.slnf --no-restore
        -c ${{ env.Configuration }}
        /p:Platform="Any CPU" /m

    - name: 发布独立部署版本
      run: ./publish.ps1 -Configuration ${{ env.Configuration }} -Platform ${{ matrix.platform }}

    - name: 打包特定平台的产物 (Zip/Deb/Rpm/App)
      run: ./BuildTools/package-${{ matrix.platform }}.ps1 -Configuration ${{ env.Configuration }} -Version "${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}" -StagingDirectory $env:StagingDirectory

    - name: 上传压缩包构建产物 (Linux x64)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy Linux x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}/ILSpy_linux-x64_*.zip
        if-no-files-found: error

    - name: 上传 deb 安装包 (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy Linux x64 deb ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}/*.deb
        if-no-files-found: error

    - name: 上传 rpm 安装包 (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy Linux x64 rpm ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}/*.rpm
        if-no-files-found: error

    - name: 上传 app 应用程序包 (macOS arm64)
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ILSpy macOS arm64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}
        path: ${{ env.StagingDirectory }}/ILSpy_macos-arm64_*.zip
        if-no-files-found: error
