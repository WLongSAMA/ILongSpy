name: Build ILSpy

on:
  push:
    branches: '**'
  pull_request:
    branches: [ master, release/** ]

permissions:
  contents: read

env:
  DOTNET_SDK_VERSION: '11.0.x'
  DOTNET_SDK_QUALITY: 'preview'
  StagingDirectory: buildartifacts

jobs:
  Build:
    name: Desktop (Windows)
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        Configuration: [ Debug, Release ]
    env:
      BuildPlatform: Any CPU

    defaults:
      run:
        shell: pwsh

    steps:
    - run: mkdir -p $env:StagingDirectory


    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}
        cache: true
        cache-dependency-path: '**/packages.lock.json'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        DOTNET_ROOT: ${{ runner.temp }}/.dotnet

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Install dotnet-format
      env:
        DOTNET_FORMAT_VERSION: 10.0.100-rtm.25531.102
        DOTNET_FORMAT_SOURCE: https://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet10-transport/nuget/v3/index.json
      run: dotnet tool install -g dotnet-format --version "${{env.DOTNET_FORMAT_VERSION}}" --source "${{env.DOTNET_FORMAT_SOURCE}}"

    - name: Get Version
      id: version
      run: |
        .\BuildTools\ghactions-install.ps1
        Get-ChildItem Env: | Where-Object {$_.Name -Match "^ILSPY_"} | %{ echo "$($_.Name)=$($_.Value)" } | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore the application
      run: >
        dotnet restore ILSpy.sln
        /p:RestoreEnablePackagePruning=false
        /p:Configuration=${{ matrix.configuration }}
        /p:Platform="$env:BuildPlatform"

    - name: Build
      run: >
        dotnet build ILSpy.sln --no-restore
        -c ${{ matrix.configuration }}
        /p:Platform="$env:BuildPlatform" /m

    - name: Format check
      run: dotnet-format whitespace --verify-no-changes --verbosity detailed ILSpy.sln

    - name: Execute unit tests
      run: >
        dotnet test --solution ilspy.sln
        --configuration ${{ matrix.configuration }}
        --no-build --report-trx
        --results-directory test-results/${{ matrix.configuration }}

    - name: Upload Test Logs
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results-${{ matrix.configuration }}
        path: 'test-results/${{ matrix.configuration }}/*.trx'

    - name: Create Test Report
      uses: test-summary/action@v2
      if: always()
      with:
        paths: "test-results/${{ matrix.configuration }}/*.trx"
        folded: true

    # Release-only publish + zip: the win-x64 framework-dependent, win-arm64
    # framework-dependent, and win-x64 self-contained bundles. File names carry
    # the version and architecture so the artifacts are self-describing.
    - name: Publish x64/arm64 framework-dependent/self-contained
      if: matrix.configuration == 'release'
      run: .\publish.ps1 -Configuration ${{ matrix.configuration }}

    - name: Zip ILSpy (x64 framework-dependent)
      if: matrix.configuration == 'release'
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_binaries_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-x64.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ matrix.configuration }}\net10.0\win-x64\publish\fwdependent\*

    - name: Zip ILSpy (arm64 framework-dependent)
      if: matrix.configuration == 'release'
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_binaries_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-arm64.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ matrix.configuration }}\net10.0\win-arm64\publish\fwdependent\*

    - name: Zip ILSpy (x64 self-contained)
      if: matrix.configuration == 'release'
      run: >
        7z a -tzip $env:StagingDirectory\ILSpy_selfcontained_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-x64.zip '-xr!*.pdb'
        .\ILSpy\bin\${{ matrix.configuration }}\net10.0\win-x64\publish\selfcontained\*

    - name: Verify package contents
      if: matrix.configuration == 'debug'
      run: |
        .\BuildTools\create-filelists.ps1
        git diff --exit-code

    - name: Upload x64 framework-dependent zip
      if: matrix.configuration == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy binaries x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (${{ matrix.configuration }})
        path: ${{ env.StagingDirectory }}\ILSpy_binaries_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-x64.zip
        if-no-files-found: error

    - name: Upload arm64 framework-dependent zip
      if: matrix.configuration == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy binaries arm64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (${{ matrix.configuration }})
        path: ${{ env.StagingDirectory }}\ILSpy_binaries_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-arm64.zip
        if-no-files-found: error

    - name: Upload x64 self-contained zip
      if: matrix.configuration == 'release'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy self-contained x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (${{ matrix.configuration }})
        path: ${{ env.StagingDirectory }}\ILSpy_selfcontained_${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}-x64.zip
        if-no-files-found: error

  # Linux and macOS build the desktop solution filter, run the UI and decompiler tests on
  # their own platform, and package self-contained Release bundles. The Windows job above
  # produces the framework-dependent and self-contained zip bundles; the installer, the VS
  # extension, and NuGet packages are not built. The decompiler tests need the ILSpy-tests
  # submodule (the TargetNet40 configs compile against its legacy reference assemblies even
  # on non-Windows); configs that genuinely need Windows (legacy csc, mcs, 32-bit, roundtrip)
  # self-exclude via Tester.SupportedOnCurrentPlatform and [Platform("Win")]. ILSpy.Tests.Windows
  # runs only in the Windows job by design.

  Desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: pwsh

    steps:
    - run: mkdir -p $env:StagingDirectory

    - uses: actions/checkout@v7
      with:
        submodules: true
        fetch-depth: 0
        persist-credentials: false

    - uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ env.DOTNET_SDK_VERSION }}
        dotnet-quality: ${{ env.DOTNET_SDK_QUALITY }}
        cache: true
        cache-dependency-path: '**/packages.lock.json'
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/.dotnet
        DOTNET_ROOT: ${{ runner.temp }}/.dotnet

    - name: Get Version
      id: version
      run: |
        ./BuildTools/ghactions-install.ps1
        Get-ChildItem Env: | Where-Object {$_.Name -Match "^ILSPY_"} | %{ echo "$($_.Name)=$($_.Value)" } | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore the application
      run: >
        dotnet restore ILSpy.Desktop.slnf
        /p:RestoreEnablePackagePruning=false
        /p:Configuration=Release
        /p:Platform="Any CPU"

    - name: Build
      run: >
        dotnet build ILSpy.Desktop.slnf --no-restore
        -c Release
        /p:Platform="Any CPU" /m

    - name: Execute UI tests
      run: >
        dotnet test --project ILSpy.Tests/ILSpy.Tests.csproj
        --configuration Release
        --no-build --report-trx
        --results-directory test-results

    - name: Execute decompiler tests
      run: >
        dotnet test --project ICSharpCode.Decompiler.Tests/ICSharpCode.Decompiler.Tests.csproj
        --configuration Release
        --no-build --report-trx
        --results-directory test-results

    - name: Upload Test Logs
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results-${{ matrix.platform }}
        path: 'test-results/*.trx'

    - name: Create Test Report
      uses: test-summary/action@v2
      if: always()
      with:
        paths: "test-results/*.trx"
        folded: true

    - name: Publish (self-contained)
      run: ./publish.ps1 -Configuration Release -Platform ${{ matrix.platform }}

    - name: Package
      run: ./BuildTools/package-${{ matrix.platform }}.ps1 -Configuration Release -Version "${{ steps.version.outputs.ILSPY_VERSION_NUMBER }}" -StagingDirectory $env:StagingDirectory

    - name: Upload zip build artifact (Linux)
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy Linux x64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (Release)
        path: ${{ env.StagingDirectory }}/ILSpy_linux-x64_*.zip
        if-no-files-found: error

    - name: Upload deb build artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy Linux x64 deb ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (Release)
        path: ${{ env.StagingDirectory }}/*.deb
        if-no-files-found: error

    - name: Upload rpm build artifact
      if: matrix.platform == 'linux'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy Linux x64 rpm ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (Release)
        path: ${{ env.StagingDirectory }}/*.rpm
        if-no-files-found: error

    - name: Upload app bundle build artifact (macOS)
      if: matrix.platform == 'macos'
      uses: actions/upload-artifact@v7
      with:
        name: ILSpy macOS arm64 ${{ steps.version.outputs.ILSPY_VERSION_NUMBER }} (Release)
        path: ${{ env.StagingDirectory }}/ILSpy_macos-arm64_*.zip
        if-no-files-found: error
